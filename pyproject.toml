[project]
name = "planka-mcp"
version = "0.2.0"
description = "MCP server that lets an AI agent autonomously pick up and complete work in Planka"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.9.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
planka-mcp = "planka_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planka_mcp"]
